name: TEMPORARY Playground memory

# Temporary, removed before this branch is ready for review. Measures how
# much memory a Playground preview takes in Chromium, for a few ways of
# building the preview.

on:
  push:
    branches: [claude/project-thread-weygzs]
    paths:
      - '.github/tmp-memory/**'
      - '.github/workflows/tmp-playground-memory.yml'

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [bare, current, current-noimages, zip, current-seamless]
    steps:
      - name: Measure
        run: |
          mkdir work && cd work
          npm init -y > /dev/null
          npm i playwright@1.65.1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/tmp-memory/measure.js" -o measure.js
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" VARIANT="${{ matrix.variant }}" node measure.js
