name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "Requires PHP: 8.1" per the plugin header, through current stable.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 php -l

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS (plugin)
        run: composer phpcs

      - name: Run PHPCS (tests)
        run: composer phpcs-tests

  asset-checks:
    name: JSON + JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate JSON (block.json, manifest.json, composer.json)
        run: |
          set -e
          find . -name '*.json' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -I{} sh -c 'jq empty "{}" && echo "OK {}"'

      - name: JS syntax check (no build step — vanilla ES2020)
        run: |
          set -e
          find assets -name '*.js' -print0 | xargs -0 -n1 node --check

  blocks-build:
    name: Block editor build (committed output current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The built editor bundle is committed and shipped (the release zip
      # only contains git-tracked files), so a rebuild must produce a
      # no-op diff. Catches a contributor changing src/ but forgetting to
      # commit the output — the exact failure the plugin checks for at
      # release time.
      - name: Build and verify the committed bundle is current
        run: |
          set -e
          npm run build
          if ! git diff --quiet -- build/ package-lock.json; then
            echo "::error::build/ is stale — run 'npm run build' and commit the output"
            git diff --stat -- build/ package-lock.json
            exit 1
          fi

  changelog:
    name: Changelog in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # CHANGELOG.md is the source of truth; readme.txt's == Changelog ==
      # section is generated from it. This fails with a diff if the two have
      # drifted, so wordpress.org can never show a stale changelog.
      - name: readme.txt changelog matches CHANGELOG.md
        run: bin/sync-changelog.sh --check

  license:
    name: LICENSE present (GPLv2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Guards against accidentally dropping the license: a GPL plugin must
      # ship its full license text, and it must not be excluded from the zip.
      - name: LICENSE exists and is GPLv2
        run: |
          set -e
          test -f LICENSE || { echo "::error::LICENSE file is missing"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE || { echo "::error::LICENSE is not the GNU GPL"; exit 1; }
          grep -q "Version 2" LICENSE || { echo "::error::LICENSE is not GPL version 2"; exit 1; }

      - name: LICENSE is not excluded from the distributed build
        run: |
          set -e
          if grep -qxE 'LICENSE(\.(txt|md))?' .distignore; then
            echo "::error::LICENSE must not be listed in .distignore — it has to ship in the plugin zip"
            exit 1
          fi
