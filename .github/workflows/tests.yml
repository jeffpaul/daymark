name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes the run for the previous commit
# pointless, so cancel it instead of letting it finish. Pushes to main are
# never cancelled: each one is a real record of what landed.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only documentation (Markdown, readme.txt,
  # docs/, LICENSE) cannot change what the tests test, so the heavy steps
  # below skip for it. The jobs themselves still run, and finish in a few
  # seconds, instead of being skipped outright: a skipped *matrix* job is
  # reported under its unexpanded name, which would leave the required checks
  # ("Browser E2E (Playwright, WP latest)", "PHPUnit (WP stable, PHP 8.2)", and
  # so on) waiting forever. Anything else — code, tests, workflows, fixtures —
  # runs everything, and so does every push to main. If the changed-files
  # lookup fails for any reason, everything runs.
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Are there changes outside documentation?
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') || [ -z "$files" ]; then
            echo "Could not list the changed files; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qvE '^(docs/.+|.+\.md|readme\.txt|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; skipping the heavy test steps."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Resolves the three WordPress versions every job tests against, per our
  # "latest and latest-minus-one" support policy (see also
  # wordpress-version-checker.yml, which bumps "Requires at least"/"Tested
  # up to" against the same policy):
  #   minimum — our actually-declared floor, read straight from daymark.php's
  #             "Requires at least" header (NOT independently recomputed as
  #             "stable minus one" — the declared floor can sit above that
  #             arithmetic result, as it does today: Daymark hard-depends on
  #             the WP 7.0 AI Client with no existence shims, so "latest
  #             minus one" cannot go below 7.0 while 7.0 is still current.
  #             wordpress-version-checker.yml already owns moving this
  #             number forward on each new WP release — this just tests
  #             whatever it last set).
  #   stable  — the current release (X.Y from the official API; "Tested up to")
  #   nightly — the highest RC of the NEXT version when one exists
  #             (release-candidate window), otherwise trunk
  # During an RC window this means every PR — including the automated
  # tested-up-to bump PR from the WordPress Version Checker — tests against
  # the actual upcoming release, so a green nightly leg means the bump is
  # safe to merge ahead of the release date.
  #
  # Each matrix entry carries a fixed `label` (minimum/stable-or-latest/
  # nightly) alongside the real `wp` version to install. Job names and the
  # branch ruleset's required-check list key off `label`, which never
  # changes — only `wp` moves as RC numbers advance (RC1 -> RC2 -> ... ->
  # final). This is what lets nightly's actual version drift without ever
  # requiring a ruleset update again.
  resolve:
    name: Resolve WordPress versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stable: ${{ steps.resolve.outputs.stable }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      scratch-matrix: ${{ steps.resolve.outputs.scratch-matrix }}
      phpunit-matrix: ${{ steps.resolve.outputs.phpunit-matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve minimum + stable + candidate
        id: resolve
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import urllib.request

          def head_ok(url):
              request = urllib.request.Request(url, method='HEAD')
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status == 200
              except Exception:
                  return False

          with urllib.request.urlopen(
              'https://api.wordpress.org/core/version-check/1.7/'
          ) as response:
              offer = json.load(response)['offers'][0]['version']
          major, minor = (int(p) for p in offer.split('.')[:2])
          stable = f'{major}.{minor}'

          # WordPress versioning: X.9 is followed by (X+1).0.
          nxt = f'{major + 1}.0' if minor == 9 else f'{major}.{minor + 1}'

          with open('daymark.php') as plugin_file:
              match = re.search(r'Requires at least:\s*(\d+\.\d+)', plugin_file.read())
          if not match:
              raise SystemExit('Could not find "Requires at least" in daymark.php')
          minimum = match.group(1)

          candidate = 'nightly'
          for n in range(9, 0, -1):  # highest published RC wins
              if head_ok(f'https://wordpress.org/wordpress-{nxt}-RC{n}.zip'):
                  candidate = f'{nxt}-RC{n}'
                  break

          print(f'stable={stable}')
          print(f'candidate={candidate}')
          # Scratch installs use wp-cli's 'latest' for the stable leg;
          # PHPUnit needs the explicit stable number to pick the matching
          # wordpress-develop branch. Labels are fixed; only `wp` varies.
          print(f'scratch-matrix={json.dumps([{"label": "minimum", "wp": minimum}, {"label": "latest", "wp": "latest"}, {"label": "nightly", "wp": candidate}])}')
          print(f'phpunit-matrix={json.dumps([{"label": "minimum", "wp": minimum}, {"label": "stable", "wp": stable}, {"label": "nightly", "wp": candidate}])}')
          PY
          cat "$GITHUB_OUTPUT"

  phpunit:
    name: PHPUnit (WP ${{ matrix.config.label }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, changes]
    # The nightly leg (RC or trunk) is early warning for the next WordPress
    # release: failures show on the run but do not block merges. minimum
    # and stable are both part of our declared support policy and block.
    continue-on-error: ${{ matrix.config.label == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        config: ${{ fromJSON(needs.resolve.outputs.phpunit-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code == 'true'

      # The runner image already ships MySQL 8.0 (root password "root"); starting
      # it takes a few seconds, where pulling and health-checking a MySQL
      # service container took about half a minute in every job.
      - name: Start MySQL
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE wordpress_test'

      - name: Set up PHP
        if: needs.changes.outputs.code == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd
          coverage: none
          tools: composer

      - name: Install WordPress test library (WP ${{ matrix.config.label }})
        if: needs.changes.outputs.code == 'true'
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 '${{ matrix.config.wp }}' true

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        if: needs.changes.outputs.code == 'true'
        run: WP_TESTS_DIR=/tmp/wordpress-tests-lib composer test

  # The whole PHPUnit suite again with the real Parse This plugin loaded
  # (tests/parse-this-stub/load.php loads it from DAYMARK_PARSE_THIS_DIR),
  # so every link-preview and microformats test also runs through Daymark's
  # optional Parse This path. Pinned to a release tag. Not in the required
  # checks: a Parse This change should be looked at, not block a merge.
  phpunit-parse-this:
    name: PHPUnit with Parse This (WP stable, PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, changes]
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code == 'true'

      - name: Start MySQL
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE wordpress_test'

      - name: Set up PHP
        if: needs.changes.outputs.code == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd
          coverage: none
          tools: composer

      - name: Install WordPress test library (WP stable)
        if: needs.changes.outputs.code == 'true'
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 '${{ needs.resolve.outputs.stable }}' true

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Get Parse This 2.0.0
        if: needs.changes.outputs.code == 'true'
        run: git clone --quiet --depth 1 --branch 2.0.0 https://github.com/dshanske/parse-this.git /tmp/parse-this

      - name: Run PHPUnit with Parse This
        if: needs.changes.outputs.code == 'true'
        run: DAYMARK_PARSE_THIS_DIR=/tmp/parse-this WP_TESTS_DIR=/tmp/wordpress-tests-lib composer test

  smoke:
    name: Smoke suite (WP ${{ matrix.config.label }}, live install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, changes]
    # The nightly leg (RC or trunk) is early warning; non-blocking. minimum
    # and latest are both part of our declared support policy and block.
    continue-on-error: ${{ matrix.config.label == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.resolve.outputs.scratch-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code == 'true'

      # The runner image already ships MySQL 8.0 (root password "root"); starting
      # it takes a few seconds, where pulling and health-checking a MySQL
      # service container took about half a minute in every job.
      - name: Start MySQL
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE wp_smoke'

      - name: Set up PHP
        if: needs.changes.outputs.code == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd
          coverage: none

      # Installed by our own script (retries + checksum), not setup-php's
      # `tools: wp-cli`, whose download failed intermittently.
      - name: Install WP-CLI
        if: needs.changes.outputs.code == 'true'
        run: bash bin/install-wp-cli.sh

      - name: Install scratch WordPress (${{ matrix.config.label }})
        if: needs.changes.outputs.code == 'true'
        run: |
          bash bin/download-wp.sh '${{ matrix.config.wp }}' /tmp/wp
          wp config create --path=/tmp/wp --dbname=wp_smoke --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=/tmp/wp --url=http://smoke.test --title=Smoke \
            --admin_user=admin --admin_password=admin --admin_email=admin@smoke.test --skip-email

      - name: Link and activate the plugin
        if: needs.changes.outputs.code == 'true'
        run: |
          ln -s "$GITHUB_WORKSPACE" /tmp/wp/wp-content/plugins/daymark
          wp plugin activate daymark --path=/tmp/wp

      - name: Run smoke suite (57 assertions, E2E scenarios 1-10)
        if: needs.changes.outputs.code == 'true'
        run: |
          printf '#!/bin/bash\nexec wp --path=/tmp/wp "$@"\n' > "$RUNNER_TEMP/wpx"
          chmod +x "$RUNNER_TEMP/wpx"
          WP="$RUNNER_TEMP/wpx" bash tests/smoke.sh

  playwright:
    name: Browser E2E (Playwright, WP ${{ matrix.config.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve, changes]
    # The nightly leg (RC or trunk) is early warning; non-blocking. minimum
    # and latest are both part of our declared support policy and block.
    continue-on-error: ${{ matrix.config.label == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.resolve.outputs.scratch-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.code == 'true'

      # The runner image already ships MySQL 8.0 (root password "root"); starting
      # it takes a few seconds, where pulling and health-checking a MySQL
      # service container took about half a minute in every job.
      - name: Start MySQL
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo systemctl start mysql.service
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE wp_e2e'

      - name: Set up PHP
        if: needs.changes.outputs.code == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd
          coverage: none

      # Installed by our own script (retries + checksum), not setup-php's
      # `tools: wp-cli`, whose download failed intermittently.
      - name: Install WP-CLI
        if: needs.changes.outputs.code == 'true'
        run: bash bin/install-wp-cli.sh

      - name: Install scratch WordPress (${{ matrix.config.label }})
        if: needs.changes.outputs.code == 'true'
        run: |
          bash bin/download-wp.sh '${{ matrix.config.wp }}' /tmp/wp
          wp config create --path=/tmp/wp --dbname=wp_e2e --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=/tmp/wp --url=http://127.0.0.1:8889 --title=E2E \
            --admin_user=admin --admin_password=admin --admin_email=admin@e2e.test --skip-email
          # /daymark and the section pages need pretty permalinks in a browser.
          wp rewrite structure '/%postname%/' --path=/tmp/wp

      - name: Link and activate the plugin
        if: needs.changes.outputs.code == 'true'
        run: |
          ln -s "$GITHUB_WORKSPACE" /tmp/wp/wp-content/plugins/daymark
          wp plugin activate daymark --path=/tmp/wp
          wp rewrite flush --path=/tmp/wp

      - name: Seed E2E fixtures
        if: needs.changes.outputs.code == 'true'
        run: |
          mkdir -p /tmp/wp/wp-content/mu-plugins
          # Registers a fake publishing helper so the awareness-note test
          # has something to detect.
          cp "$GITHUB_WORKSPACE/tests/e2e/fixtures/daymark-e2e-publish-helper.php" /tmp/wp/wp-content/mu-plugins/
          # Registers a fake controllable helper for the per-Mark toggle test.
          cp "$GITHUB_WORKSPACE/tests/e2e/fixtures/daymark-e2e-controllable-helper.php" /tmp/wp/wp-content/mu-plugins/
          # Registers a fake CONNECTED connector for the destination-toggle test.
          cp "$GITHUB_WORKSPACE/tests/e2e/fixtures/daymark-e2e-connector.php" /tmp/wp/wp-content/mu-plugins/
          # Relaxes Daymark's rate limits so the suite's rapid-fire publishes
          # don't 429 (the limiter itself is covered by PHPUnit).
          cp "$GITHUB_WORKSPACE/tests/e2e/fixtures/daymark-e2e-rate-limit.php" /tmp/wp/wp-content/mu-plugins/
          # A couple of categories so the "File under" picker has a real
          # choice beyond the site's single default category.
          wp term create category "E2E Photos" --path=/tmp/wp || true
          wp term create category "E2E Travel" --path=/tmp/wp || true
          # Dismiss the editor's first-visit "Welcome to the editor" guide so
          # the blocks-editor spec sees the editor canvas (fresh installs show
          # the guide on the first post-new.php load).
          wp user meta update 1 wp_persisted_preferences \
            '{"isWelcomeGuide":false,"core/editor":{"isWelcomeGuide":false}}' --path=/tmp/wp

      - name: Start web server
        if: needs.changes.outputs.code == 'true'
        run: |
          wp server --host=127.0.0.1 --port=8889 --path=/tmp/wp &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8889/wp-login.php && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8889/wp-login.php

      - name: Set up Node
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      # Caches the downloaded browser binary (~150MB), keyed on the locked
      # Playwright version so a version bump invalidates it automatically.
      # `playwright install` itself skips re-downloading on a cache hit but
      # still ensures the OS-level packages `--with-deps` installs are
      # present, which a fresh runner VM never carries over between runs.
      - name: Cache Playwright browser binaries
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright
        if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        if: needs.changes.outputs.code == 'true'
        env:
          WP_BASE_URL: http://127.0.0.1:8889
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: admin
        run: npx playwright test

      - name: Upload traces on failure
        if: failure() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.config.label }}
          path: test-results/
          retention-days: 7
