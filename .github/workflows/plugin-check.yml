name: Plugin Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes the run for the previous commit
# pointless, so cancel it. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    # Blocking since the 0.7.0 hardening pass: findings fail the run so
    # dot-org-style review stays clean on every PR. Warnings fail it too
    # (`strict` below), because nobody reads a green job's log: 25 warnings
    # sat in it unseen when 0.23.0 shipped, two of them the readme sections
    # wordpress.org then cut off.
    steps:
      - uses: actions/checkout@v7.0.1

      # .distignore (the plugin zip) and .gitattributes (GitHub's source
      # archives) must leave out the same files, and no Markdown file may sit
      # at the top of the plugin. See the script's own header.
      - name: Check what ships
        run: bin/check-dist.sh

      - name: Set up PHP for runtime dependencies
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Build distribution copy (respects .distignore)
        run: |
          bash bin/build-dist.sh /tmp/dist/daymark

      - name: Run plugin check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: /tmp/dist/daymark
          # Treat a warning as an error. A finding that is a false positive
          # gets a `phpcs:ignore` with its reason, next to the code.
          strict: true

      - name: Archive installable plugin
        run: cd /tmp/dist && zip -rq "$RUNNER_TEMP/daymark.zip" daymark

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: daymark-dist
          path: ${{ runner.temp }}/daymark.zip
          retention-days: 7
