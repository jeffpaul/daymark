name: Plugin Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    # Blocking since the 0.7.0 hardening pass: findings fail the run so
    # dot-org-style review stays clean on every PR.
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build distribution copy (respects .distignore)
        run: |
          mkdir -p /tmp/dist/daymark
          rsync -a --exclude-from=.distignore --exclude='.git' ./ /tmp/dist/daymark/

      - name: Run plugin check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: /tmp/dist/daymark
