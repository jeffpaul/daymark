name: PR Playground Preview

# Adds a "Preview in WordPress Playground" button to the PR as a managed
# comment. No build step needed — the plugin is plain PHP/JS, so the
# blueprint installs it straight from the PR branch via git:directory.
#
# Why a comment and not the PR description: this repo squash-merges using
# the PR title + description as the commit message (so Co-authored-by
# trailers land in the merge commit — see credit-contributors.yml). A
# button appended to the description therefore baked a multi-line
# base64-ish blueprint data URI into permanent git history. A comment
# keeps the button on the PR and out of the commit message.
#
# Runs as `pull_request_target` so it has a write token on fork PRs, which
# is how community contributions arrive: a plain `pull_request` run from a
# fork gets a read-only token and cannot post the comment. It never checks
# out or executes PR code — the only PR-controlled values it touches are the
# head repo URL and branch name, read from the event payload, passed through
# `env:` (never interpolated into a shell command) and serialized with
# JSON.stringify into a blueprint that Playground, not this runner, acts on
# — which makes this a safe use of the trigger, same as
# credit-contributors.yml and pr-review-checklist.yml. Because the workflow
# file is always read from the base branch, a change to this file only takes
# effect once it is merged.
#
# NOTE: Playground fetches the branch from the browser, unauthenticated,
# so the button only works while the head repository (this one, or a
# contributor's fork) is PUBLIC and the branch still exists. On a private
# repo, or once a fork's branch is deleted, the instance cannot load the
# plugin.
on:
  pull_request_target:
    # `synchronize` is included even though the blueprint's own content
    # never changes across pushes (it points at the PR's branch name, not a
    # commit SHA) — the underlying action manages a single comment rather
    # than posting a new one each run, so a later `synchronize` just updates
    # (or creates) that same comment instead of duplicating it. That matters
    # because a PR opened via the GitHub API (rather than a person pushing
    # through the web UI) does not reliably deliver a plain `pull_request`
    # `opened` event, so an `opened`-only trigger can silently never run for
    # such a PR. The first real push after that (a `synchronize`) is this
    # workflow's fallback chance to still post the button.
    types: [opened, synchronize, reopened]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  playground-preview:
    name: Add Playground preview button to the PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Generate Playground blueprint JSON
        id: blueprint
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const repoUrl = process.env.REPO_URL;
          const ref = process.env.HEAD_REF;
          if (!repoUrl || !ref) {
            throw new Error('REPO_URL and HEAD_REF are required');
          }

          // Preset a few real, publicly-syndicating sites as subscriptions
          // so a reviewer lands in a Timeline that already has content to
          // scroll, search, and click into — not an empty "subscribe to
          // your first site" state.
          // Site URL => display name to store as the subscription's title
          // (an empty name keeps the title discovery found).
          const presetSites = {
            'https://jeffpaul.com': 'Jeffrey Paul',
            'https://jondesrosiers.com': '',
            'https://aaron.jorb.in': 'Aaron Jorbin',
            'https://xkcd.com': 'xkcd',
          };

          // runPHP steps don't auto-bootstrap WordPress — require wp-load.php
          // first, same as Playground's own documented examples. By this
          // point the preceding installPlugin step has already activated
          // Daymark, so Daymark_Plugin::instance() is fully wired up.
          // subscribe_to_site()/poll_subscription() are the same two calls
          // the wp-admin Subscribe form and its background poller make;
          // is_wp_error() is checked (not thrown on) so one unreachable site
          // doesn't stop the others from being preset.
          //
          // Built as a joined array (not a multi-line template literal) so
          // every line of source here stays indented inside this run: |
          // block scalar — a raw embedded newline would dedent to column 0
          // and break the surrounding YAML.
          const presetPhp = [
            '<?php',
            "require_once '/wordpress/wp-load.php';",
            '',
            '$plugin = Daymark_Plugin::instance();',
            '',
            `$preset_sites = json_decode( ${JSON.stringify(JSON.stringify(presetSites))}, true );`,
            'foreach ( $preset_sites as $site_url => $site_name ) {',
            '\t$result = $plugin->subscriptions->subscribe_to_site( $site_url );',
            '\tif ( ! is_wp_error( $result ) ) {',
            "\t\tif ( '' !== $site_name ) {",
            "\t\t\t$plugin->subscriptions->update( (int) $result, array( 'site_title' => $site_name ) );",
            '\t\t}',
            '\t\t$plugin->subscription_poller->poll_subscription( (int) $result );',
            '\t}',
            '}',
            '',
            // Sample Marks for each Mark type and Featured Content kind
            // (image, gallery, Check In, and Featured Content gallery /
            // quote / link / video). The script and its sample photos ship
            // in the plugin checkout this preview installs, so nothing is
            // fetched or generated at run time — see
            // .github/blueprints/seed-sample-content.php.
            "$seed = dirname( DAYMARK_PLUGIN_FILE ) . '/.github/blueprints/seed-sample-content.php';",
            'if ( file_exists( $seed ) ) {',
            '\trequire $seed;',
            '}',
            '',
          ].join('\n');

          const blueprint = {
            preferredVersions: {
              // WP 7.0+ required; 'latest' is 7.0 as of May 2026 (Armstrong).
              wp: 'latest',
            },
            login: true,
            // Land straight in the Daymark app shell.
            landingPage: '/daymark',
            steps: [
              {
                // A reviewer debugging a real failure in this preview (a
                // silent PHP notice, an outbound fetch that didn't do what
                // was expected) has no SSH/file manager to inspect
                // wp-content/debug.log with — WP_DEBUG_DISPLAY stays false
                // so a real visitor (there are none here) never sees a raw
                // error, but WP_DEBUG_LOG means the log is at least being
                // written for whatever admin-side tooling reads it.
                step: 'defineWpConfigConsts',
                consts: {
                  WP_DEBUG: true,
                  WP_DEBUG_LOG: true,
                  WP_DEBUG_DISPLAY: false,
                },
              },
              {
                // /daymark relies on rewrite rules; Playground defaults to
                // plain permalinks, so set a pretty structure before the
                // activation hook flushes rewrites.
                step: 'setSiteOptions',
                options: {
                  permalink_structure: '/%postname%/',
                },
              },
              {
                step: 'installPlugin',
                pluginData: {
                  resource: 'git:directory',
                  url: repoUrl,
                  ref,
                  path: '/',
                },
                options: {
                  activate: true,
                },
              },
              {
                step: 'runPHP',
                code: presetPhp,
              },
            ],
          };

          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE
        env:
          REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Post Playground preview button
        uses: WordPress/action-wp-playground-pr-preview@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          # Comment, not append-to-description: keeps the blueprint data URI
          # out of the squash-merge commit message (see the note above).
          mode: comment
          blueprint: ${{ steps.blueprint.outputs.blueprint }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
