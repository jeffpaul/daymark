name: Live Preview blueprint

# Runs the Live Preview blueprint
# (.wordpress-org/blueprints/blueprint.json) in WordPress Playground, the
# way the "Live Preview" button on https://wordpress.org/plugins/daymark/
# and the README's "Try it" link do, and fails when the preview would not
# come up with its demo content.
#
# The blueprint installs the *released* Daymark from wordpress.org and reads
# the demo script (set-up-demo.php), the sample Marks it publishes and their
# photos from .github/blueprints/ on `main`. So a change to a demo file
# reaches the public preview the moment it merges, running against a release
# that may be older than the change. This job is the guard for that: it runs
# the released plugin with the demo files from the branch under test, which
# is exactly what the public gets once the branch merges.
#
# The demo script follows four real sites. Whether they answer is not
# something a pull request can fix, so the job reports how many were
# followed and only warns when some were not.
#
# It only runs when one of those files changes, because it needs
# wordpress.org and github.com to answer and should not hold up an unrelated
# pull request when one of them is slow. "Run workflow" runs it by hand.
#
# PHPUnit covers the same files with no network at all
# (tests/test-wporg-blueprint.php, tests/test-playground-blueprint.php).

on:
  pull_request:
    paths:
      - '.wordpress-org/blueprints/**'
      - '.github/blueprints/**'
      - '.github/workflows/wporg-blueprint.yml'
  push:
    branches: [main]
    paths:
      - '.wordpress-org/blueprints/**'
      - '.github/blueprints/**'
      - '.github/workflows/wporg-blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playground:
    name: Run in Playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Playground command-line runner. Pinned so a run can be repeated;
      # raise it now and then (the website always runs the newest).
      PLAYGROUND_CLI_VERSION: 3.1.54
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Two changes to the copy that is run, and none to the file itself:
      # the demo files come from the branch under test instead of `main`,
      # and a last step writes down what the preview ended up with. The
      # branch and repository names go in as jq arguments, never into the
      # shell.
      - name: Build the copy to run
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/count.php" <<'PHP'
          <?php
          require_once '/wordpress/wp-load.php';

          $result = array( 'active' => class_exists( 'Daymark_Plugin' ) );

          if ( $result['active'] ) {
              $result['version']   = DAYMARK_VERSION;
              $result['following'] = count( Daymark_Plugin::instance()->subscriptions->get_active() );
              $result['from_them'] = (int) wp_count_posts( Daymark_Subscription_Post_Type::POST_TYPE )->publish;
              $result['marks']     = count(
                  get_posts(
                      array(
                          'post_type'      => 'post',
                          'post_status'    => 'publish',
                          'posts_per_page' => -1,
                          'meta_key'       => '_daymark_is_mark',
                          'fields'         => 'ids',
                      )
                  )
              );
              $result['hello']     = null !== get_page_by_path( 'hello-world', OBJECT, 'post' );
          }

          file_put_contents( '/daymark-result/result.json', wp_json_encode( $result ) );
          PHP

          jq --arg url "$HEAD_REPO" --arg ref "$HEAD_REF" --rawfile count "$RUNNER_TEMP/count.php" '
            ( .steps[]
              | select( .step == "writeFiles" and .filesTree.resource == "git:directory" )
              | .filesTree
            ) |= ( .url = $url | .ref = $ref )
            | .steps += [ { step: "runPHP", code: $count } ]
          ' .wordpress-org/blueprints/blueprint.json > "$RUNNER_TEMP/blueprint.json"

          echo "Demo files from $HEAD_REPO at $HEAD_REF"
          jq '.steps |= map( del( .code ) )' "$RUNNER_TEMP/blueprint.json"

      # The folder mounted at /daymark-result is how the count gets back out:
      # the runner prints nothing a step echoes.
      - name: Run the blueprint
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          npx --yes "@wp-playground/cli@${PLAYGROUND_CLI_VERSION}" run-blueprint \
            --blueprint="$RUNNER_TEMP/blueprint.json" \
            --mount="$RUNNER_TEMP/result:/daymark-result"

      # No result file means the last step never ran, which fails here too.
      - name: Check what the preview came up with
        run: |
          result="$RUNNER_TEMP/result/result.json"
          if [ ! -s "$result" ]; then
            echo "::error::The blueprint finished without writing its result, so the preview was not checked."
            exit 1
          fi

          jq . "$result"
          {
            echo "### Live Preview"
            echo
            jq -r '"Daymark \(.version // "not active"): following \(.following // 0) sites, \(.from_them // 0) posts from them, \(.marks // 0) sample Marks."' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '.active and .marks >= 8 and ( .hello | not )' "$result" > /dev/null; then
            echo "::error::The preview is missing demo content. Daymark should be active, with 8 sample Marks and no \"Hello world!\" post."
            exit 1
          fi

          # The four followed sites are other people's, reached over the
          # runner's network. One being down is not this branch's fault.
          if ! jq -e '.following >= 4 and .from_them >= 1' "$result" > /dev/null; then
            echo "::warning::The preview followed fewer than its 4 sites, or read no posts from them. Check that each site in the blueprint still answers."
          fi
