name: Live Preview blueprint

# Runs the wordpress.org Live Preview blueprint
# (.wordpress-org/blueprints/blueprint.json) in WordPress Playground, the
# way the "Live Preview" button on https://wordpress.org/plugins/daymark/
# does, and fails when the preview would not come up with its demo content.
#
# The blueprint installs the *released* Daymark from wordpress.org and reads
# its demo files (the sample Marks and the made-up friends) from
# .github/blueprints/ on `main`. So a change to a demo file reaches the
# public preview the moment it merges, running against a release that may be
# older than the change. This job is the guard for that: it runs the
# released plugin with the demo files from the branch under test, which is
# exactly what the public gets once the branch merges.
#
# It only runs when one of those files changes, because it needs
# wordpress.org and github.com to answer and should not hold up an unrelated
# pull request when one of them is slow. "Run workflow" runs it by hand.
#
# PHPUnit covers the same files with no network at all
# (tests/test-wporg-blueprint.php, tests/test-playground-blueprint.php).

on:
  pull_request:
    paths:
      - '.wordpress-org/blueprints/**'
      - '.github/blueprints/**'
      - '.github/workflows/wporg-blueprint.yml'
  push:
    branches: [main]
    paths:
      - '.wordpress-org/blueprints/**'
      - '.github/blueprints/**'
      - '.github/workflows/wporg-blueprint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playground:
    name: Run in Playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The Playground command-line runner. Pinned so a run can be repeated;
      # raise it now and then (the website always runs the newest).
      PLAYGROUND_CLI_VERSION: 3.1.54
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Two changes to the copy that is run, and none to the file itself:
      # the demo files come from the branch under test instead of `main`,
      # and a last step counts what the preview ended up with. The branch
      # and repository names go in as jq arguments, never into the shell.
      - name: Build the copy to run
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/check.php" <<'PHP'
          <?php
          require_once '/wordpress/wp-load.php';

          if ( ! class_exists( 'Daymark_Plugin' ) ) {
              throw new Exception( 'Daymark is not active.' );
          }

          $following = count( Daymark_Plugin::instance()->subscriptions->get_active() );
          $from_them = (int) wp_count_posts( Daymark_Subscription_Post_Type::POST_TYPE )->publish;
          $marks     = count(
              get_posts(
                  array(
                      'post_type'      => 'post',
                      'post_status'    => 'publish',
                      'posts_per_page' => -1,
                      'meta_key'       => '_daymark_is_mark',
                      'fields'         => 'ids',
                  )
              )
          );
          $summary   = sprintf(
              'Daymark %s: following %d sites, %d posts from them, %d sample Marks.',
              DAYMARK_VERSION,
              $following,
              $from_them,
              $marks
          );

          if ( $following < 4 || $from_them < 8 || $marks < 8 ) {
              throw new Exception( 'The preview is missing demo content. ' . $summary );
          }

          error_log( $summary );
          PHP

          jq --arg url "$HEAD_REPO" --arg ref "$HEAD_REF" --rawfile check "$RUNNER_TEMP/check.php" '
            ( .steps[]
              | select( .step == "writeFiles" and .filesTree.resource == "git:directory" )
              | .filesTree
            ) |= ( .url = $url | .ref = $ref )
            | .steps += [ { step: "runPHP", code: $check } ]
          ' .wordpress-org/blueprints/blueprint.json > "$RUNNER_TEMP/blueprint.json"

          echo "Demo files from $HEAD_REPO at $HEAD_REF"
          jq '.steps |= map( del( .code ) )' "$RUNNER_TEMP/blueprint.json"

      - name: Run the blueprint
        run: npx --yes "@wp-playground/cli@${PLAYGROUND_CLI_VERSION}" run-blueprint --blueprint="$RUNNER_TEMP/blueprint.json"
