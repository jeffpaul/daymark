name: Release

# Tag-driven release: pushing a version tag (v0.1.0 or 0.1.0) builds the
# .distignore-filtered distribution zip via wp dist-archive and attaches it
# to a GitHub release — creating the release, or uploading to it if one
# was already drafted by hand for the tag. The zip is the artifact to install for testing and
# the exact tree that would be committed to the wordpress.org SVN trunk.
#
# Guard: the tag must match the plugin's declared version everywhere —
# moment.php header, MOMENT_VERSION, and readme.txt Stable tag — or the
# release fails before anything is published.

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions: {}

jobs:
  release:
    name: Build dist zip and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify tag matches declared plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: //p' moment.php)
          constant=$(sed -n "s/^define( 'MOMENT_VERSION', '\(.*\)' );$/\1/p" moment.php)
          stable=$(sed -n 's/^Stable tag: //p' readme.txt)
          echo "tag=$tag_version header=$header constant=$constant stable=$stable"
          for v in "$header" "$constant" "$stable"; do
            if [ "$v" != "$tag_version" ]; then
              echo "::error::Version mismatch: tag v$tag_version vs declared '$v'"
              exit 1
            fi
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: wp-cli

      - name: Build distribution zip
        env:
          # setup-php can leave composer with an invalid github-oauth token, which
          # breaks `wp package install` ("github oauth token ... contains invalid
          # characters") since it shells out to composer. Force a valid token via
          # COMPOSER_AUTH, which takes precedence over any stored auth config.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          # Pinned: v3.2+ requires wp-cli ^2.13, which is not yet released —
          # v3.1.0 works with the wp-cli 2.12 that setup-php installs.
          wp package install wp-cli/dist-archive-command:v3.1.0
          wp dist-archive . "$PWD/moment.zip"
          unzip -l moment.zip

      - name: Guard the zip contents
        run: |
          listing=$(unzip -l moment.zip)
          echo "$listing" | grep -q 'moment/readme.txt' || { echo '::error::readme.txt missing from zip'; exit 1; }
          echo "$listing" | grep -q 'moment/moment.php' || { echo '::error::moment.php missing from zip'; exit 1; }
          for banned in 'moment/tests/' 'moment/docs/' 'moment/README.md' 'moment/CLAUDE.md' 'moment/node_modules/' 'moment/vendor/' 'moment/moment-connector-'; do
            if echo "$listing" | grep -q "$banned"; then
              echo "::error::dev file leaked into zip: $banned"
              exit 1
            fi
          done
          # Every file in the zip must be git-tracked — catches untracked
          # strays (build caches, local scratch files) .distignore missed.
          unzip -Z1 moment.zip | sed -n 's|^moment/||p' | grep -v '/$' | grep . | while read -r f; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || { echo "::error::untracked file in zip: $f"; exit 1; }
          done

      # Release notes come from the tag's readme.txt changelog section — the same
      # user-facing text wordpress.org shows — so the release, the plugin readme,
      # and wp.org never drift apart. GitHub's --generate-notes emits a raw list
      # of merged PRs instead (Dependabot bumps, the release PR itself), which is
      # internal churn rather than "what changed for you"; it stays only as the
      # fallback for a tag with no matching changelog section.
      - name: Build release notes from the readme changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Written outside the checkout so it can never be mistaken for a
          # repository file (the zip is already built and guarded by this point).
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"
          section=$(awk -v v="= $version =" '
            $0==v {f=1; next}
            f && /^= [0-9]/ {exit}
            f && /^== / {exit}
            f' readme.txt | sed '/^$/d')

          if [ -z "$section" ]; then
            echo "::warning::No '= $version =' section in readme.txt; falling back to generated notes."
            echo 'file=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Previous release = the next version heading below this one.
          esc=$(printf '%s' "$version" | sed 's/\./\\./g')
          prev=$(sed -n "/^= $esc =\$/,\$p" readme.txt \
            | sed -n 's/^= \([0-9][0-9.]*\) =$/\1/p' | sed -n 2p)

          {
            echo "## What's Changed"
            echo "$section"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
            fi
          } > "$notes_file"

          echo "--- release notes ---"
          cat "$notes_file"
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          # An existing release was drafted by hand — attach the zip but leave
          # whatever notes were written there alone.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" moment.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" moment.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Moment ${GITHUB_REF_NAME#v}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" moment.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Moment ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
