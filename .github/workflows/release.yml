name: Release

# Tag-driven release: pushing a version tag (v0.1.0 or 0.1.0) builds the
# .distignore-filtered distribution zip (same rsync approach as
# plugin-check.yml's dist build) and attaches it to a GitHub release —
# creating the release, or uploading to it if one was already drafted by
# hand for the tag. The zip is the artifact to install for testing and the
# exact tree that would be committed to the wordpress.org SVN trunk.
#
# Guard: the tag must match the plugin's declared version everywhere —
# daymark.php header, DAYMARK_VERSION, and readme.txt Stable tag — or the
# release fails before anything is published.

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions: {}

jobs:
  release:
    name: Build dist zip and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify tag matches declared plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: //p' daymark.php)
          constant=$(sed -n "s/^define( 'DAYMARK_VERSION', '\(.*\)' );$/\1/p" daymark.php)
          stable=$(sed -n 's/^Stable tag: //p' readme.txt)
          echo "tag=$tag_version header=$header constant=$constant stable=$stable"
          for v in "$header" "$constant" "$stable"; do
            if [ "$v" != "$tag_version" ]; then
              echo "::error::Version mismatch: tag v$tag_version vs declared '$v'"
              exit 1
            fi
          done

      - name: Build distribution zip
        run: |
          # Previously built via `wp dist-archive` (wp-cli/dist-archive-command),
          # which shells out to wp-cli's own internal Composer bootstrap to
          # install itself — that bootstrap started rejecting the runner's
          # GITHUB_TOKEN format outright ("github oauth token ... contains
          # invalid characters"), deterministically failing every run
          # regardless of retries or an explicit COMPOSER_AUTH override.
          # Plain rsync avoids wp-cli/Composer entirely and matches
          # plugin-check.yml's own already-working dist build.
          workdir=$(mktemp -d)
          rsync -a --exclude-from=.distignore --exclude='.git' ./ "$workdir/daymark/"
          (cd "$workdir" && zip -rq daymark.zip daymark)
          mv "$workdir/daymark.zip" "$PWD/daymark.zip"
          unzip -l daymark.zip

      - name: Guard the zip contents
        run: |
          listing=$(unzip -l daymark.zip)
          echo "$listing" | grep -q 'daymark/readme.txt' || { echo '::error::readme.txt missing from zip'; exit 1; }
          echo "$listing" | grep -q 'daymark/daymark.php' || { echo '::error::daymark.php missing from zip'; exit 1; }
          for banned in 'daymark/tests/' 'daymark/docs/' 'daymark/README.md' 'daymark/CHANGELOG.md' 'daymark/CLAUDE.md' 'daymark/node_modules/' 'daymark/vendor/' 'daymark/daymark-connector-'; do
            if echo "$listing" | grep -q "$banned"; then
              echo "::error::dev file leaked into zip: $banned"
              exit 1
            fi
          done
          # Every file in the zip must be git-tracked — catches untracked
          # strays (build caches, local scratch files) .distignore missed.
          unzip -Z1 daymark.zip | sed -n 's|^daymark/||p' | grep -v '/$' | grep . | while read -r f; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || { echo "::error::untracked file in zip: $f"; exit 1; }
          done

      # Release notes are the tag's CHANGELOG.md section, verbatim — the same
      # Keep a Changelog entries that generate readme.txt's changelog, so the
      # release, the plugin readme, and wordpress.org cannot drift apart.
      # GitHub's --generate-notes emits a raw list of merged PRs instead
      # (Dependabot bumps, the release PR itself), which is internal churn
      # rather than "what changed for you"; it stays only as the fallback for a
      # tag with no matching section.
      - name: Build release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Written outside the checkout so it can never be mistaken for a
          # repository file (the zip is already built and guarded by this point).
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"

          # The section runs from this version's heading to the next one (or to
          # the link-reference block at the end of the file).
          section=$(awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { f = 1; next }
            f && /^## \[/ { exit }
            f && /^\[[^]]+\]:[[:space:]]/ { exit }
            f' CHANGELOG.md | awk 'NF { blank = 0; print; next } { if (!blank++ && NR > 1) print }')

          if [ -z "$section" ]; then
            echo "::warning::No '## [$version]' section in CHANGELOG.md; falling back to generated notes."
            echo 'file=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Previous release = the next version heading below this one.
          prev=$(awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { f = 1; next }
            f && /^## \[/ {
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*/, "", line)
              print line
              exit
            }' CHANGELOG.md)

          {
            printf '%s\n' "$section"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
            fi
          } > "$notes_file"

          echo "--- release notes ---"
          cat "$notes_file"
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          # An existing release was drafted by hand — attach the zip but leave
          # whatever notes were written there alone.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" daymark.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" daymark.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" daymark.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
