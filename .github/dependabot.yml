# Keeps pinned GitHub Actions and dev dependencies current. Every PR Dependabot
# opens runs through the existing CI (tests, PHPCS, plugin-check) and the
# dependency-review license gate before it can merge. Updates are grouped so a
# quiet week produces one PR per ecosystem rather than a flood.
version: 2
updates:
  # Pinned action SHAs in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # PHP dev dependencies (PHPUnit, WPCS, etc.) in the root composer.json.
  # The plugin's runtime libraries live in /lib instead (below).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(dev)"
    groups:
      composer-dev:
        patterns:
          - "*"

  # Runtime libraries shipped in the plugin zip (web-push and its JWT,
  # crypto, and math dependencies), copied into lib/vendor-prefixed/ by
  # bin/build-bundled-libs.sh. Dependabot only updates lib/composer.lock:
  # before merging its PR, run `bash bin/build-bundled-libs.sh` and commit
  # the rebuilt lib/vendor-prefixed/ to the same branch. CI's "Bundled
  # libraries match lib/composer.lock" check fails until that's done.
  - package-ecosystem: "composer"
    directory: "/lib"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      composer-bundled:
        patterns:
          - "*"

  # JS dev dependencies (Playwright, etc.) — no bundled runtime JS deps.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(dev)"
    groups:
      npm-dev:
        patterns:
          - "*"
