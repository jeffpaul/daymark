name: Enhancement request
description: Suggest an improvement or new capability for Daymark
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        Two to four plain sentences a middle-school student could follow.
        What you want Daymark to do, who it helps, and why. Skip code names and jargon; put the details in the fields below.
      placeholder: "I'd like to schedule a Mark to publish later, so I can write it now and share it at a better time."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or pain point behind the request, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like Daymark to do.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives or additional context
      description: Other approaches you considered, mockups, or links.
